<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="pikachu.png" type="image/png">
<title>포켓몬 도감 단어장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 나무 책상 위 링 단어장 한 묶음. 링은 왼쪽, 넘긴 카드는 링 왼쪽으로 쌓인다. 카드 안: 왼쪽 개념 / 오른쪽 빈칸 한 줄 */
:root{
  --desk:#eceef0; --desk2:#e3e6e9; --card:#fbf8ef; --card-edge:#ece6d4; --ink:#2a2a2e; --muted:#77736a;
  --line:#ddd5c0; --pen:#6b3fd1; --pen-soft:#efe8fd; --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#cc3a3a; --bad-soft:#fbe6e6;
  --metal:#a9adb3; --metal-hi:#e9ebee; --code:#f3efe2;
  --c1:#2563eb; --c1s:#e3ecfd; --c2:#16a34a; --c2s:#e2f5e8; --c3:#d97706; --c3s:#fdf0dc;
  --hand:"Gaegu","Comic Sans MS",cursive; --body:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#191b1f; --desk2:#1d2025; --card:#2b2a26; --card-edge:#3a3830; --ink:#ece6d6; --muted:#a8a293; --line:#46423a;
  --pen:#b79cff; --pen-soft:#2f2741; --ok:#5fd38a; --ok-soft:#173022; --bad:#ff8080; --bad-soft:#3a1d1d;
  --metal:#7d828a; --metal-hi:#c4c8ce; --code:#23221f;
  --c1:#7aa7ff; --c1s:#1b2a47; --c2:#5fd38a; --c2s:#16301f; --c3:#f5b14a; --c3s:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#191b1f; --desk2:#1d2025; --card:#2b2a26; --card-edge:#3a3830; --ink:#ece6d6; --muted:#a8a293; --line:#46423a;
  --pen:#b79cff; --pen-soft:#2f2741; --ok:#5fd38a; --ok-soft:#173022; --bad:#ff8080; --bad-soft:#3a1d1d;
  --metal:#7d828a; --metal-hi:#c4c8ce; --code:#23221f;
  --c1:#7aa7ff; --c1s:#1b2a47; --c2:#5fd38a; --c2s:#16301f; --c3:#f5b14a; --c3s:#3a2a12; color-scheme:dark}
html,body{min-height:100%}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;
  background:var(--desk) repeating-linear-gradient(180deg,transparent 0 46px,var(--desk2) 46px 48px)}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--hand);font-size:2.2rem;line-height:1;margin:0;font-weight:700}
header p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem}
.score{display:flex;gap:8px;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.score span{padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.score .o{color:var(--ok)} .score .x{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:.8rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--pen);border-color:var(--pen);color:#fff}

/* 단어장 */
.stage{position:relative;padding-left:120px;perspective:1600px}
.pile{position:absolute;left:0;top:30px;width:150px;height:calc(100% - 60px);pointer-events:none}
.pile i{position:absolute;inset:0;background:var(--card);border:1px solid var(--card-edge);border-radius:8px;box-shadow:0 2px 6px -3px rgba(0,0,0,.25);transform-origin:100% 50%}
.stack{position:relative}
.stack::before,.stack::after{content:"";position:absolute;inset:0;background:var(--card);border:1px solid var(--card-edge);border-radius:10px}
.stack::before{transform:translate(4px,6px)} .stack::after{transform:translate(8px,12px);z-index:-1}
.stack.empty::before,.stack.empty::after{display:none}
.card{position:relative;z-index:2;background:var(--card);border:1px solid var(--card-edge);border-radius:10px;
  box-shadow:0 14px 30px -18px rgba(30,30,40,.45);padding:22px 24px 20px 64px;min-height:300px;
  display:grid;grid-template-columns:1fr 1fr;gap:22px;transform-origin:30px 50%;backface-visibility:hidden}
.hole{position:absolute;left:22px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--desk);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.ring{position:absolute;left:-104px;top:50%;width:150px;height:120px;margin-top:-100px;z-index:5;pointer-events:none;overflow:visible}
.ring path{fill:none;stroke-linecap:round}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted)}
.tag{font-weight:700;letter-spacing:.04em;color:var(--pen);background:var(--pen-soft);padding:2px 10px;border-radius:999px}
.no{font-family:var(--mono);font-variant-numeric:tabular-nums}
.concept{min-width:0;display:flex;flex-direction:column;gap:8px;border-right:1.5px dashed var(--line);padding-right:22px}
.concept h2{font-family:var(--hand);font-size:1.75rem;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.concept p{margin:0;max-width:60ch}
.concept ul{margin:0;padding-left:1.1rem}
.concept b{color:var(--pen)}
code{font-family:var(--mono);font-size:.86em;background:var(--code);padding:1px 5px;border-radius:4px}
.quiz{min-width:0;display:flex;flex-direction:column;gap:10px}
.quiz .ask{font-size:.85rem;color:var(--muted)}
.quiz pre{margin:0;padding:12px 14px;background:var(--code);border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.8}
.quiz input{font:600 13px var(--mono);color:var(--pen);background:transparent;border:none;border-bottom:2px solid var(--pen);padding:0 4px;text-align:center;min-width:3ch}
.quiz input:focus{outline:none;background:var(--pen-soft)}
.quiz input.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.quiz input.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.fb{border-radius:8px;padding:10px 12px;font-size:.9rem}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb .v{font-family:var(--hand);font-size:1.35rem;font-weight:700;margin-right:6px}
.fb.ok .v{color:var(--ok)} .fb.bad .v{color:var(--bad)}
.fb .ans{font-family:var(--mono);font-weight:600}
.hint{font-size:.8rem;color:var(--muted)}
kbd{font-family:var(--mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}

/* 미니 그림 */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.8rem}
.chip{padding:3px 9px;border-radius:6px;border:1.5px solid var(--line);background:var(--code);font-family:var(--mono);font-size:.75rem}
.chip.c1{border-color:var(--c1);background:var(--c1s);color:var(--c1)}
.chip.c2{border-color:var(--c2);background:var(--c2s);color:var(--c2)}
.chip.c3{border-color:var(--c3);background:var(--c3s);color:var(--c3)}
.chip.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.arw{color:var(--muted)}
.nest{border:2px solid var(--c1);background:var(--c1s);border-radius:8px;padding:5px 6px 6px;font:600 .72rem var(--mono);color:var(--c1)}
.nest .nest{border-color:var(--c2);background:var(--c2s);color:var(--c2);margin-top:4px}
.nest .nest .nest{border-color:var(--c3);background:var(--c3s);color:var(--c3)}
.bars{display:grid;gap:3px;font-size:.72rem;color:var(--muted)}
.bars div{display:flex;gap:2px;align-items:center}
.bars s{display:block;height:9px;border-radius:2px;text-decoration:none}

/* 넘기기 */
.card.out{animation:flipOut .45s cubic-bezier(.5,0,.75,0) forwards}
.card.in{animation:flipIn .45s cubic-bezier(.25,1,.5,1)}
.card.rise{animation:rise .3s ease-out}
@keyframes flipOut{to{transform:rotateY(-175deg);opacity:.2}}
@keyframes flipIn{from{transform:rotateY(-175deg);opacity:.2}}
@keyframes rise{from{transform:translate(6px,8px)}}
@media (prefers-reduced-motion:reduce){.card.out,.card.in,.card.rise{animation-duration:.01s}}

.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-left:120px}
.controls button{font:inherit;font-size:.9rem;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.controls button.go{background:var(--pen);border-color:var(--pen);color:#fff}
.controls button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

.end{grid-column:1/-1;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.end h2{font-family:var(--hand);font-size:2.4rem;margin:0}
.end .row{display:flex;gap:8px;flex-wrap:wrap}
.end button{font:inherit;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.end button.go{background:var(--pen);border-color:var(--pen);color:#fff}

@media (max-width:720px){
  .stage{padding-left:0;padding-top:34px}
  .pile{display:none}
  .ring{left:50%;top:-56px;margin-top:0;margin-left:-20px;width:40px;height:70px}
  .card{grid-template-columns:1fr;padding:30px 16px 18px;transform-origin:50% 0}
  .hole{left:50%;top:12px;margin-left:-8px;margin-top:0}
  .concept{border-right:none;border-bottom:1.5px dashed var(--line);padding:0 0 14px}
  .wrap{padding-block:14px 0;gap:12px}
  header h1{font-size:1.75rem}
  header p{font-size:.8rem}
  .score{font-size:.75rem}
  .score span{padding:2px 8px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto;padding:6px 12px}
  .card{min-height:0;gap:14px}
  .concept h2{font-size:1.5rem}
  .concept{font-size:.95rem}
  .quiz pre{white-space:pre-wrap;word-break:break-word;font-size:12px;padding:10px 12px}
  .quiz input{font-size:16px;padding:2px 6px;min-height:30px}
  .fb{font-size:.88rem;scroll-margin-bottom:96px}
  .controls{margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));padding-left:max(16px, env(safe-area-inset-left, 0px))!important;padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .controls{position:sticky;bottom:0;z-index:8;background:var(--desk);padding-left:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  .controls .hint{display:none}
  .controls button{flex:1;min-height:48px;white-space:nowrap;font-size:1rem}
  @keyframes flipOut{to{transform:rotateX(175deg);opacity:.2}}
  @keyframes flipIn{from{transform:rotateX(175deg);opacity:.2}}
  .stack::before{transform:translate(0,6px)} .stack::after{transform:translate(0,12px)}
}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>포켓몬 도감 단어장</h1>
      <p>React Router · 비동기 · Axios · useEffect · clientLoader · 배포</p>
    </div>
    <div class="score"><span class="o" id="sO">맞음 0</span><span class="x" id="sX">틀림 0</span><span id="sL">남음 0</span></div>
  </header>
  <div class="chips" id="chips"></div>

  <div class="stage">
    <div class="pile" id="pile"></div>
    <div class="stack" id="stack">
      <svg class="ring" id="ring" viewBox="0 0 150 120" aria-hidden="true"></svg>
      <article class="card" id="card"></article>
    </div>
  </div>

  <div class="controls">
    <button id="prev">← 이전 장</button>
    <span class="hint"><kbd>Enter</kbd> 채점 → <kbd>Enter</kbd> 넘기기</span>
    <button class="go" id="next">넘기기 →</button>
  </div>
</div>

<script>
const CARDS = [
 {tag:"비동기", t:"왜 비동기일까",
  c:`<p>자바스크립트는 일하는 손이 <b>하나</b>다. 응답을 멈춰서 기다리면 클릭도 화면도 같이 멈춘다.</p><p>그래서 요청은 브라우저에 맡겨두고 바로 다음 줄로 간다. 응답은 대기열에 줄을 서서 <b>하던 일이 다 끝난 뒤</b> 처리된다.</p>
  <div class="flow"><span class="chip c1">log A</span><span class="arw">→</span><span class="chip c2">get 맡김</span><span class="arw">→</span><span class="chip c1">log C</span><span class="arw">→</span><span class="chip c3">대기열의 B</span></div>`,
  ask:"출력 순서를 써보자 (예: ABC)", code:`console.log("A")
axios.get(url).then(() => console.log("B"))
console.log("C")
// 출력: ⟦⟧`, a:["ACB","A→C→B","A->C->B","A,C,B"], w:"then 콜백은 응답이 온 뒤, 그것도 지금 실행 중인 코드(A, C)가 다 끝난 뒤에야 실행된다."},

 {tag:"비동기", t:"콜백 지옥",
  c:`<p>다음 요청에 <b>이전 결과가 필요</b>하면, "이전 요청이 끝난 순간"에 다음 요청을 보내야 한다.</p><p>그 순간은 코드에서 <b>콜백 함수 안쪽</b>뿐이다. 그래서 콜백 안에 콜백, 그 안에 또 콜백. 양파처럼 계단이 깊어진다.</p>
  <div class="nest">getData(data, () =&gt; {<div class="nest">getData(next, () =&gt; {<div class="nest">getData(final, …)</div></div></div>`,
  ask:"빈칸에 들어갈 말", code:`// 중첩된 콜백 때문에 코드가 계단처럼
// 깊어지는 상황 = 콜백 ⟦⟧`, a:["지옥","hell","callbackhell","콜백지옥"], w:"Callback Hell. 들여쓰기가 깊어져서 읽기도, 디버깅도, 유지보수도 어려워진다."},

 {tag:"Promise", t:"Promise = 약속 영수증",
  c:`<p><code>axios.get()</code>은 데이터가 아니라 <b>Promise</b>를 바로 돌려준다. "나중에 결과 줄게"라는 영수증이다.</p>
  <div class="flow"><span class="chip">pending 대기</span><span class="arw">→</span><span class="chip c2">fulfilled → then</span><span class="arw">/</span><span class="chip bad">rejected → catch</span></div>`,
  ask:"성공했을 때 실행할 함수를 등록하는 메서드", code:`axios.get(url)
  .⟦⟧((res) => console.log(res.data))`, a:["then"], w:"성공(fulfilled)하면 then에 넣은 함수가 실행된다."},

 {tag:"Promise", t:"then 체이닝",
  c:`<p>then 안에서 다음 요청을 <b>return</b>하면 다음 then으로 이어진다. 안으로 파고들지 않고 아래로 줄을 세울 수 있다.</p><p>어느 단계에서 실패해도 맨 끝 <b>catch 하나</b>가 다 받는다.</p>`,
  ask:"다음 then으로 넘기려면?", code:`axios.get(".../data")
  .then((res1) => {
    ⟦⟧ axios.get(".../nextData")
  })
  .then((res2) => console.log(res2.data))
  .catch((err) => console.error(err))`, a:["return"], w:"return하지 않으면 다음 then은 nextData 응답을 기다리지 않고 undefined를 받는다."},

 {tag:"async/await", t:"async",
  c:`<p>함수 앞에 <b>async</b>를 붙이면 안에서 <b>await</b>를 쓸 수 있다. async 함수는 무엇을 return하든 항상 Promise를 돌려준다.</p>
  <div class="flow"><span class="chip c1">d1 = await</span><span class="arw">↓</span><span class="chip c2">d2 = await</span><span class="arw">↓</span><span class="chip c3">d3 = await</span></div><p>콜백 지옥의 세 단계가 위에서 아래로 한 줄씩 펴진다.</p>`,
  ask:"함수 선언 앞 키워드", code:`⟦⟧ function fetchData() {
  const response = await axios.get(url)
}`, a:["async"], w:"await는 async 함수 안에서만 쓸 수 있다. 빼면 문법 오류다."},

 {tag:"async/await", t:"await",
  c:`<p><b>await</b>는 Promise가 끝날 때까지 <b>그 함수만</b> 잠깐 멈추고, 결과값을 꺼내준다.</p><p>화면(main thread)은 멈추지 않는다. 겉모습만 동기, 속은 여전히 비동기다.</p>`,
  ask:"응답이 올 때까지 기다리게 하려면", code:`async function fetchData() {
  const response = ⟦⟧ axios.get(url)
  console.log(response.data)
}`, a:["await"], w:"await가 없으면 response에는 데이터가 아니라 Promise가 들어간다."},

 {tag:"Axios", t:"res.data",
  c:`<p>Axios는 HTTP 요청 라이브러리. 응답 본문을 이미 객체로 바꿔서 <b>.data</b>에 넣어준다.</p><ul><li>fetch는 <code>await res.json()</code>을 한 번 더 해야 한다.</li><li>axios는 404·500이면 에러를 던진다(catch로 감).</li><li><code>res.status</code>엔 200 같은 상태 코드.</li></ul>`,
  ask:"응답 본문이 들어있는 속성", code:`const response = await axios.get(url)
console.log(response.⟦⟧)`, a:["data"], w:"axios 응답 객체의 본문은 항상 .data에 있다."},

 {tag:"async/await", t:"try / catch",
  c:`<p>async/await에서는 then/catch 대신 <b>try / catch</b>로 에러를 잡는다. await에서 실패하면 바로 catch 블록으로 점프한다.</p>`,
  ask:"에러가 날 수 있는 코드를 감싸는 블록", code:`async function getAllData() {
  ⟦⟧ {
    const res1 = await axios.get(".../data")
  } catch (err) {
    console.error(err)
  }
}`, a:["try"], w:"try 안에서 던져진 에러를 바로 아래 catch가 받는다."},

 {tag:"패턴", t:"Guard Clause",
  c:`<p>"괜찮으면 안으로"를 반복하면 if가 겹겹이 쌓인다. 반대로 <b>문제 있으면 바로 return</b>하면 정상 흐름이 왼쪽 벽에 붙어 쭉 내려온다.</p><p>조건이 뒤집힌다: <code>===</code> → <code>!==</code>, <code>&amp;&amp;</code> → <code>||</code></p>`,
  ask:"200이 아니면 바로 나가자", code:`if (!response || response.status ⟦⟧ 200) {
  console.error('Error')
  return
}`, a:["!=="], w:"상태 코드가 200이 '아니면' 실패이므로 !==. (!=도 동작은 하지만 강의는 !==)"},

 {tag:"라우팅", t:"routes.ts 주소록",
  c:`<p>SPA는 HTML이 한 장뿐이다. 주소가 바뀌면 React Router가 <b>app/routes.ts</b> 주소록을 보고 컴포넌트만 바꿔 끼운다.</p><ul><li><code>index()</code>: 첫 화면 <code>/</code></li><li><code>route()</code>: 특정 주소 → 파일</li></ul>`,
  ask:"첫 화면(/)을 정의하는 함수", code:`export default [
  ⟦⟧("routes/list.tsx"),
  route("detail/:id", "routes/detail.tsx"),
] satisfies RouteConfig`, a:["index"], w:"index()는 기본 경로(/)를 정의한다."},

 {tag:"라우팅", t:"동적 파라미터 :id",
  c:`<p>콜론(<b>:</b>)이 붙은 자리는 바뀌는 값이다. <code>/detail/25</code>로 오면 <code>params.id</code>가 <code>"25"</code>.</p>
  <div class="flow"><span class="chip c1">/detail/25</span><span class="arw">→</span><span class="chip c2">detail/:id</span><span class="arw">→</span><span class="chip c3">detail.tsx</span></div>`,
  ask:"id가 들어갈 자리", code:`route("detail/⟦⟧", "routes/detail.tsx")`, a:[":id"], w:"콜론을 빼면 정확히 'detail/id'라는 글자 주소만 매칭된다."},

 {tag:"라우팅", t:"Link",
  c:`<p><code>&lt;a&gt;</code>는 페이지를 통째로 새로 불러와서 깜빡인다. <b>&lt;Link&gt;</b>는 새로고침 없이 컴포넌트만 바꾼다.</p><p>이동할 주소는 <b>to</b> 속성에. 변수가 들어가니 backtick 템플릿 문자열.</p>`,

</Link>`, a:["to"], w:"a 태그의 href 역할을 Link에서는 to가 한다."},

 {tag:"라우팅", t:"params.id는 문자열",

 {tag:"Tailwind", t:"반응형 접두사",
  c:`<p>접두사 없는 클래스가 <b>모바일 기본값</b>. 그 위에 너비 조건으로 덮어쓴다.</p>

 {tag:"Tailwind", t:"상태 변형",
  c:`<p>사용자 행동에 반응하는 접두사.</p><ul><li><b>hover:</b> 마우스를 올렸을 때</li><li><b>focus:</b> 입력창 커서가 있을 때</li><li><b>active:</b> 꾹 누르는 순간</li></ul><p><code>transition</code>을 같이 써야 변화가 부드럽다.</p>`,

 {tag:"useEffect", t:"왜 useEffect 안에서?",
  c:`<p>컴포넌트 함수는 그릴 때마다 다시 실행된다. 거기서 바로 요청하면 받음 → setState → 다시 그림 → 또 요청… <b>무한 반복</b>.</p><p>그래서 "그린 뒤, 정한 때에만" 실행되는 useEffect 안에서 요청한다. 의존 배열이 "언제"를 정한다.</p>`,
  ask:"처음 한 번만 실행하는 의존 배열", code:`useEffect(() => {
  fetchPokemons()
}, ⟦⟧)`, a:["[]"], w:"빈 배열이면 처음 그려질 때 1회만. 목록은 한 번 받으면 끝이라 list.tsx는 []."},

 {tag:"useEffect", t:"의존 배열에 id",
  c:`<p>상세 페이지는 보는 포켓몬이 바뀌면 다시 받아와야 한다. 그래서 의존 배열에 <b>id</b>를 넣는다. 값이 바뀔 때마다 재실행.</p><p>참고: useEffect 콜백 자체엔 async를 못 붙여서, 안에 async 함수를 만들고 바로 호출한다.</p>`,
  ask:"id가 바뀔 때마다 다시 실행", code:`useEffect(() => {
  fetchPokemon()
}, [⟦⟧])`, a:["params.id"], w:"의존 배열에 params.id를 넣으면 주소의 id가 바뀔 때마다 다시 요청한다."},

 {tag:"useEffect", t:"로딩은 finally에서 끄기",
  c:`<p><b>finally</b>는 성공이든 실패든 마지막에 꼭 실행된다.</p><ul><li>try에서만 끄면 실패 시 로딩이 영원히 남는다.</li><li>catch에서만 끄면 성공 시 남는다.</li></ul>`,
  ask:"성공·실패 상관없이 실행되는 블록", code:`try {
  // 요청
} catch (error) {
  console.error(error)
} ⟦⟧ {
  setLoading(false)
}`, a:["finally"], w:"setLoading(false)는 두 경우 모두 필요하니 finally가 정답 자리."},

 {tag:"Axios", t:"Promise.all",
  c:`<p>목록 API는 이름과 url만 준다. 이미지를 얻으려면 100마리 각각 또 요청해야 한다.</p>
  <div class="bars"><div>하나씩 await <s style="width:22%;background:var(--bad)"></s><s style="width:22%;background:var(--bad)"></s><s style="width:22%;background:var(--bad)"></s>…</div><div>Promise.all <s style="width:24%;background:var(--ok)"></s> ← 동시에 출발, 한 번만 기다림</div></div>
  <p>결과 순서는 넣은 순서 그대로. 대신 하나라도 실패하면 전체 실패.</p>`,
  ask:"여러 Promise를 동시에 기다리는 메서드", code:`const data = await Promise.⟦⟧(
  results.map(async ({ url }) => {
    const res = await axios.get(url)
    return res.data
  })
)`, a:["all"], w:"Promise.all은 배열 안 Promise가 전부 끝날 때까지 한 번에 기다린다."},

 {tag:"clientLoader", t:"그리기 전에 미리 받기",
  c:`<div class="flow"><span class="chip bad">useEffect: 이동 → 로딩 중… → 요청 → 다시 그림</span></div><div class="flow"><span class="chip c2">clientLoader: 요청 → 다 받고 이동 → 한 번에 그림</span></div><p>순서가 뒤집혀서 useState·useEffect·loading 처리가 전부 사라진다. 이 이름으로 <b>export</b>해야 React Router가 찾아서 실행한다.</p>`,
  ask:"React Router가 렌더 전에 실행하는 함수 이름", code:`export async function ⟦⟧({ request }: Route.ClientLoaderArgs) {
  const response = await axios.get(url)
  return response.data
}`, a:["clientLoader"], w:"이름이 정확히 clientLoader여야 한다. loader는 서버용."},

 {tag:"clientLoader", t:"useLoaderData",
  c:`<p>clientLoader가 return한 값은 컴포넌트에서 <b>useLoaderData</b>로 꺼낸다.</p><p><code>&lt;typeof clientLoader&gt;</code>를 붙이면 반환 타입이 자동으로 따라온다.</p>`,
  ask:"로더 데이터를 꺼내는 훅", code:`export default function Detail() {
  const pokemon = ⟦⟧<typeof clientLoader>()
}`, a:["useLoaderData"], w:"use로 시작하는 React Router 훅. 데이터가 이미 와 있어서 로딩 처리가 필요 없다."},

 {tag:"clientLoader", t:"주소에서 id 뽑기",
  c:`<div class="flow"><span class="chip">"/detail/25"</span><span class="arw">split("/")</span><span class="chip c1">["","detail","25"]</span><span class="arw">filter(Boolean)</span><span class="chip c2">["detail","25"]</span><span class="arw">?</span><span class="chip c3">"25"</span></div><p>filter(Boolean)은 빈 문자열(false)을 걸러낸다.</p>`,
  ask:"배열의 마지막 값을 꺼내는 메서드", code:`const pokemonId = url.pathname
  .split("/").filter(Boolean).⟦⟧()`, a:["pop"], w:"pop()은 배열 끝 값을 꺼낸다. 여기선 id \"25\"."},

 {tag:"clientLoader", t:"SPA 모드",
  c:`<p>clientLoader는 <b>브라우저에서만</b> 도는 코드다. 서버 렌더링(SSR)을 꺼야 새로고침해도 정상 동작한다.</p><p>SSR을 끄면 서버 없이 정적 파일만으로 배포할 수 있다.</p>`,

} satisfies Config`, a:["false"], w:"ssr: false = SPA(Single Page Application) 모드."},

 {tag:"한국어 이름", t:"find로 ko 찾기",
  c:`<p>pokemon API엔 영어 이름뿐이라 <b>pokemon-species</b>를 한 번 더 요청한다. <code>names</code> 배열에서 language.name이 한국어인 것 하나만 <b>find</b>.</p>`,

 {tag:"한국어 이름", t:"?. 와 ||",
  c:`<ul><li><b>?.</b> 옵셔널 체이닝: find가 못 찾아 undefined여도 <code>.name</code>에서 터지지 않고 undefined를 준다.</li><li><b>||</b>: 왼쪽이 비었으면 오른쪽 값. 한국어 이름이 없으면 영어 이름.</li></ul>`,

 {tag:"배포", t:"새로고침하면 404?",
  c:`<p>정적 서버에는 <b>index.html 한 장</b>뿐이다. <code>/detail/25</code>에서 새로고침하면 그런 파일이 없어 404.</p>
  <div class="flow"><span class="chip c1">/detail/25</span><span class="arw">→</span><span class="chip c2">rewrite → index.html</span><span class="arw">→</span><span class="chip c3">React Router가 해석</span></div><p>vercel.json은 vite.config.ts와 같은 위치.</p>`,
  ask:"vercel.json", code:`{
  "⟦⟧": [
    { "source": "/(.*)", "destination": "/index.html" }
  ]

];

const $=id=>document.getElementById(id);
const TOUCH=matchMedia("(pointer:coarse)").matches;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm=s=>s.toLowerCase().replace(/[\s"'`]/g,"");
const res=new Array(CARDS.length).fill(null); // true/false/null
let order=CARDS.map((_,i)=>i), pos=0, busy=false;

// 링
$("ring").innerHTML=`<defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--metal-hi)"/><stop offset=".5" stop-color="var(--metal)"/><stop offset="1" stop-color="var(--metal-hi)"/></linearGradient></defs>
<path d="M134 100 C 132 40, 30 20, 20 70 C 14 100, 60 112, 100 104" stroke="var(--metal)" stroke-width="9"/>
<path d="M134 100 C 132 40, 30 20, 20 70 C 14 100, 60 112, 100 104" stroke="url(#mg)" stroke-width="5"/>`;
if(matchMedia("(max-width:720px)").matches) $("ring").setAttribute("viewBox","0 0 40 70"),
  $("ring").innerHTML=`<path d="M20 66 C 0 50, 0 10, 20 4 C 40 10, 40 50, 20 66" stroke="var(--metal)" stroke-width="5" fill="none"/>`;

// 주제 칩
const tags=[...new Set(CARDS.map(c=>c.tag))];
$("chips").innerHTML=tags.map(t=>`<button data-t="${t}">${t}</button>`).join("");
$("chips").onclick=e=>{const t=e.target.dataset.t;if(!t)return;const i=order.findIndex(k=>CARDS[k].tag===t);if(i>=0){pos=i;render("rise")}};

function score(){
  const o=res.filter(r=>r===true).length,x=res.filter(r=>r===false).length;
  $("sO").textContent="맞음 "+o;$("sX").textContent="틀림 "+x;$("sL").textContent="남음 "+(CARDS.length-o-x);
}
function pile(){
  const n=Math.min(pos,4);$("pile").innerHTML=Array.from({length:n},(_,i)=>`<i style="transform:rotate(${-3+i*1.5}deg) translateX(${-i*3}px)"></i>`).join("");
}
function render(anim){
  const card=$("card");card.className="card";
  if(pos>=order.length){renderEnd();return}
  const k=order[pos],c=CARDS[k];
  const [pre,post]=c.code.split("⟦⟧");
  const w=Math.max(...c.a.map(a=>a.length))+1;
  card.innerHTML=`<span class="hole"></span>
   <div class="meta"><span class="tag">${c.tag}</span><span class="no">${String(pos+1).padStart(2,"0")} / ${order.length}</span></div>
   <div class="concept"><h2>${c.t}</h2>${c.c}</div>
   <div class="quiz"><div class="ask">Q. ${c.ask}</div>
    <pre>${esc(pre)}<input id="ans" size="${w}" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="빈칸 답">${esc(post)}</pre>
    <div class="fb" id="fb" hidden></div></div>`;
  $("stack").classList.toggle("empty",pos>=order.length-1);
  const inp=$("ans");
  if(res[k]!==null) showResult(k,res[k],"");
  else if(!TOUCH) setTimeout(()=>inp.focus({preventScroll:true}),anim==="in"?450:60);
  inp.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();e.stopPropagation();
    if(inp.readOnly) next(); else check(k)});
  if(anim){void card.offsetWidth;card.classList.add(anim)}
  $("prev").disabled=pos===0;$("next").textContent=res[k]===null?"모르겠어요 →":"넘기기 →";
  pile();
}
function check(k){
  const v=$("ans").value; if(!v.trim()){showResult(k,false,"(빈칸)");res[k]=false;score();return}
  const ok=CARDS[k].a.some(a=>norm(a)===norm(v)); res[k]=ok; score(); showResult(k,ok,v);
}
function showResult(k,ok,v){
  const c=CARDS[k],inp=$("ans");inp.readOnly=true;if(v)inp.value=v;else if(ok)inp.value=c.a[0];
  inp.classList.add(ok?"ok":"bad");
  const fb=$("fb");fb.hidden=false;fb.className="fb "+(ok?"ok":"bad");
  fb.innerHTML=`<span class="v">${ok?"정답!":"아쉽다"}</span>${ok?"":`정답 <span class="ans">${esc(c.a[0])}</span> · `}${c.w}<div class="hint" style="margin-top:4px">${TOUCH?"카드를 누르거나 옆으로 밀어서 넘기기":"<kbd>Enter</kbd> 또는 카드를 눌러 넘기기"}</div>`;
  $("next").textContent="넘기기 →";
  if(TOUCH){inp.blur();setTimeout(()=>fb.scrollIntoView({block:"nearest",behavior:"smooth"}),80)}
  else setTimeout(()=>inp.focus({preventScroll:true}),0);
}
function next(){
  if(busy||pos>=order.length)return;
  const k=order[pos]; if(res[k]===null){res[k]=false;score()}
  busy=true;const card=$("card");card.classList.remove("in","rise");void card.offsetWidth;card.classList.add("out");
  setTimeout(()=>{pos++;busy=false;render("rise");if(TOUCH)$("stack").scrollIntoView({block:"start",behavior:"smooth"})},430);
}
function prev(){ if(busy||pos===0)return; pos--; render("in"); }
function renderEnd(){
  const o=res.filter(r=>r===true).length;
  const wrong=CARDS.map((_,i)=>i).filter(i=>res[i]!==true);
  $("card").innerHTML=`<span class="hole"></span><div class="end"><h2>다 넘겼다!</h2>
   <p>${CARDS.length}장 중 <b>${o}장</b> 맞았어요. ${wrong.length?`틀린 ${wrong.length}장만 다시 넘겨볼까요?`:"전부 맞았어요."}</p>
   <div class="row">${wrong.length?`<button class="go" id="retry">틀린 카드만 다시</button>`:""}<button id="restart">처음부터</button></div></div>`;
  $("card").className="card rise";$("stack").classList.add("empty");pile();
  $("prev").disabled=false;$("next").disabled=true;
  $("retry")&&($("retry").onclick=()=>{wrong.forEach(i=>res[i]=null);order=wrong;pos=0;score();$("next").disabled=false;render("rise")});
  $("restart").onclick=()=>{res.fill(null);order=CARDS.map((_,i)=>i);pos=0;score();$("next").disabled=false;render("rise")};
}
$("next").onclick=()=>{ if(pos<order.length){const k=order[pos]; if(res[k]===null){check(k); if(!$("ans").value.trim()) return} else next()} };
$("next").onclick=()=>{ if(pos>=order.length)return; const k=order[pos]; if(res[k]===null){ if($("ans").value.trim()) check(k); else {res[k]=false;score();showResult(k,false,"")} } else next() };
$("prev").onclick=prev;
$("card").addEventListener("click",e=>{if(e.target.closest("input,button,pre"))return;const k=order[pos];if(pos<order.length&&res[k]!==null)next()});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(e.key==="Enter"||e.key==="ArrowRight"){const k=order[pos];if(pos<order.length&&res[k]!==null){e.preventDefault();next()}}
  if(e.key==="ArrowLeft")prev()});
// 스와이프
let sx=null;$("card").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
$("card").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(dx<-60){const k=order[pos];if(pos<order.length&&res[k]!==null)next()} if(dx>60)prev()});
score();render("rise");
</script>
</body>
</html>
